name: Release

# 打包正式签名的 APK 并发布到 GitHub Releases。两种触发方式：
#  1. 推送版本标签（如 v0.2.0）
#  2. 在 GitHub 网页 Actions → Release → Run workflow，输入版本号（会自动创建标签）
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - name: Check version format
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号格式应为 vX.Y.Z，收到：$TAG"; exit 1
          fi

      - name: Check version is not released yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::版本 $TAG 已经发布过了，请换一个更大的版本号（例如把最后一位 +1）"
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AL: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ] || [ -z "$AL" ]; then
            echo "::error::缺少签名 Secrets：ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS（见 docs/RELEASE.md）"
            exit 1
          fi

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_NAME="${TAG#v}"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          ./gradlew assembleRelease --no-daemon
          rm -f "$ANDROID_KEYSTORE_PATH"

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | head -5

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="lislock-${TAG}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          # 手动运行时标签还不存在，gh 会在当前提交上创建
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
            --title "LisLock ${TAG}" \
            --notes "正式签名的 Android 安装包。手机上下载 **${APK}** 后点开即可安装（需允许安装未知来源应用）。"
