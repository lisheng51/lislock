name: Release

# 推送版本标签（如 v0.2.0）时：打包正式签名的 APK，并发布到 GitHub Releases
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AL: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ] || [ -z "$AL" ]; then
            echo "::error::缺少签名 Secrets：ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS（见 docs/RELEASE.md）"
            exit 1
          fi

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_NAME="${GITHUB_REF_NAME#v}"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          ./gradlew assembleRelease --no-daemon
          rm -f "$ANDROID_KEYSTORE_PATH"

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | head -5

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="lislock-${GITHUB_REF_NAME}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --title "LisLock ${GITHUB_REF_NAME}" \
            --notes "正式签名的 Android 安装包。手机上下载 **${APK}** 后点开即可安装（需允许安装未知来源应用）。"
